%YAML 1.1
---

# Metadata for the Smart-Plugin
plugin:
    # Global plugin attributes
    type: interface                 # plugin type (gateway, interface, protocol, system, web)
    description:
        de: 'Lesen und Schreiben von Werten einer Viessmann Heizung mit Open3E'
        en: 'Read and write data of a Viessmann heating system using OPen3E'
    maintainer: sisamiwe
    tester:
    keywords: viessmann  open3e
    state: ready                    # change to ready when done with development
    version: 0.1.0                  # Plugin version
    sh_minversion: 1.12.0           # minimum shNG version to use this plugin
    py_minversion: 3.12
    multi_instance: false           # plugin supports multi instance
    restartable: true
    classname: Open3E               # class containing the plugin
    support: 

parameters:

    pause_item:
        type: str
        default: ''
        description:
            de: 'Item, um die Ausführung des Plugins zu steuern'
            en: 'item for controlling plugin execution'

    can_port:
        type: str
        default: 'can0'
        description:
            de: 'CAN-Bus-Port, mit dem das Gerät verbunden ist'
            en: 'CAN bus port the device is connected to'
    
    read_all_at_init:
        type: bool
        default: true
        description:
            de: 'Sollen alle Werte bei Start gelesen werden'
            en: 'Should all value be read at init'

    webif_pagelength:
        type: int
        default: 100
        description:
            de: 'Anzahl der Eintraege pro Seite im Webinterface'
            en: 'Number of entries per page in web interface'

item_attributes:
    open3e_ecu:
        type: str
        description:
            de: 'Konfiguriert die ECU (Geräte-ID) des Gerätes'
            en: 'Configures the ECU (device ID) of the device'

    open3e_did:
        type: str
        description:
            de: 'Konfiguriert die Datenpunkt-ID (DID) des Items und ggf. den Pfad zu einem verschachtelten Wert im JSON-Response der Heizung'
            en: 'Configures the data point ID (DID) of the item and optionally the path to a nested value in the JSON response of the heating system'

    open3e_write:
        type: bool
        description:
            de: 'Änderung des Items wird mit konfiguriertem DID an die Heizung geschickt'
            en: 'Changes to this item result in sending the configured DID to the heating system'

    open3e_read_after_write:
        type: int
        description:
            de: 'Konfiguriert eine Verzögerung in Sekunden nachdem ein Lesekommando nach einem Schreibkommando an die Heizung geschickt wird'
            en: 'Configures delay in seconds to issue a read command after write command'

    open3e_read_cycle:
        type: int
        description:
            de: 'Liest Wert mit konfiguriertem DID im Intervall aus.'
            en: 'The item value should be read by using the configured DID'

    open3e_read_at_init:
        type: bool
        default: False
        description:
            de: 'Konfiguriert, ob der Wert initialisiert werden soll'
            en: 'Configures to initialize the item value with the value'

    open3e_update_all:
        type: bool
        description:
            de: 'Liest alle konfigurierten Items neu, wenn es auf True gesetzt wird'
            en: 'Triggers reading of all configured items if set to True'

item_structs:

    pumpe:
        # _ecu: '....:_ecu1'
        # _did: 401
        # _circuit: HK1
        # _read_cycle: 30
        # struct: open3e.pumpe

        power_ist:
            name_: Pumpe {..:_circuit} Status-Ist
            type: bool
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.PowerState"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitPump.PowerState

        power_soll:
            name_: Pumpe {..:_circuit} Status-Soll
            type: bool
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.TargetPowerState"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitPump.TargetPowerState

        drehzahl_ist:
            name_: Pumpe {..:_circuit} Drehzahl-Ist
            type: num
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.ActualValue"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitPump.ActualValue

        drehzahl_soll:
            name_: Pumpe {..:_circuit} Drehzahl-Soll
            type: num
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.TargetValue"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitPump.TargetValue

        fehlerstatus:
            name_: Pumpe {..:_circuit} Fehlerstatus
            type: bool
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.ErrorState"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitPump.ErrorState

        raw:
            name_: Pumpe {..:_circuit} Rohwert
            type: dict
            open3e_ecu: ..:_ecu
            open3e_did: ..:_did
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitPump

    mischer:
        # _ecu: '....:_ecu1'
        # _did: 475
        # _circuit: HK2
        # _read_cycle: 3600
        # struct: open3e.mischer

        position_ist:
            name_: Mischerpostion {..:_circuit} Ist
            type: num
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.Actual"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitThreeWayValvePositionPercent.Actual

        position_soll:
            name_: Mischerpostion {..:_circuit} Soll
            type: num
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.ActuatorSetpoint"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitThreeWayValvePositionPercent.Setpoint

        raw:
            name_: Mischerpostion {..:_circuit} Rohwert
            type: dict
            open3e_ecu: ..:_ecu
            open3e_did: ..:_did
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerOneCircuitThreeWayValvePositionPercent

    heizkurve:
        # _ecu: '....:_ecu1'
        # _did: 880
        # _circuit: HK2
        # _read_cycle: 3600
        # struct: open3e.heizkurve

        neigung:
            name_: Heizkurve {..:_circuit} Neigung
            type: num
            open3e_write: true
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.Gradient"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerTwoCircuitCentralHeatingCurve.Gradient

        niveau:
            name_: Heizkurve {..:_circuit} Niveau
            type: num
            open3e_write: true
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.Level"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerTwoCircuitCentralHeatingCurve.Level

        basispunkt:
            name_: Heizkurve {..:_circuit} Basispunkt
            type: num
            open3e_write: true
            open3e_ecu: ..:_ecu
            open3e_did_: "{..:_did}.BasePoint"
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerTwoCircuitCentralHeatingCurve.BasePoint

        raw:
            name_: Heizkurve {..:_circuit} Rohwert
            type: dict
            open3e_ecu: ..:_ecu
            open3e_did: ..:_did
            open3e_read_cycle: ..:_read_cycle
            _did_desc: MixerTwoCircuitCentralHeatingCurve

    dtc_list:
        # =============================================================================
        # Zweck:
        #   Definition einer Diagnosemeldungsliste einschließlich:
        #   - Anzahl der Meldungen
        #   - Liste der Meldungen
        #   - Open3E-Rohwert
        #   - Aufteilung des Rohwerts in Anzahl und Meldungsliste
        #
        # Beispiel:
        #
        #   status:
        #       _ecu: '....:_ecu1'
        #       _msg_type: Status
        #   _did: 257
        #   struct: my.vitocal_250a.dtc_list
        # =============================================================================
        name: 'Anzahl der {_msg_type}meldungen'
        type: num

        meldungen:
            name: 'Liste der {_msg_type}meldungen'
            type: list

        raw:
            name: 'Rohdaten der {_msg_type}meldungen'
            type: dict
            open3e_ecu: '..:_ecu'
            open3e_did: '..:_did'
            open3e_read_cycle: 600
            on_update:
            - '.. = value["Count"]'
            - '..meldungen = value["ListEntries"]'

    energy_matrix:
        # =============================================================================
        # Zweck:
        #   Vollständige Definition einer Energieverbrauchsmatrix einschließlich:
        #   - Verbrauch des aktuellen Monats
        #   - Verbrauch des letzten Monats
        #   - Verbrauch des aktuellen Jahres
        #   - Verbrauch des letzten Jahres
        #
        # In der Anwendung zu setzen:
        #   _ecu
        #       Relative Referenz auf die ECU.
        #   _nrg_name
        #       Spezifischer Namensteil der Energiematrix,
        #       z. B. Heizenergie, WW-Energie oder Kühlenergie.
        #   _did_month
        #       Basis-DID der Monatsmatrix.
        #   _did_year
        #       Basis-DID der Jahresmatrix.
        #
        # Beispiel:
        #   verbrauch_heizen:
        #       _ecu: '...:_ecu1'
        #       _nrg_name: Heizenergie
        #       _did_month: 1294
        #       _did_year: 1316
        #       struct: my.vitocal_250a.energy_matrix
        #
        # =============================================================================
        aktueller_monat:
            name: '{_nrg_name} aktueller Monat'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did_month}.CurrentMonth'
            open3e_read_cycle: 86400

        letzter_monat:
            name: '{_nrg_name} letzter Monat'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did_month}.LastMonth'
            open3e_read_cycle: 86400

        aktuelles_jahr:
            name: '{_nrg_name} aktuelles Jahr'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did_year}.CurrentYear'
            open3e_read_cycle: 86400

        letztes_jahr:
            name: '{_nrg_name} letztes Jahr'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did: '..:{_did_year}.LastYear'
            open3e_read_cycle: 86400

    energy_meter_three_phase:
        # =============================================================================
        # Zweck:
        #   Vollständige Definition eines dreiphasigen Energiezählers
        #   einschließlich:
        #   - Leistung der Phase L1
        #   - Leistung der Phase L2
        #   - Leistung der Phase L3
        #   - Spannung der Phase L1
        #   - Spannung der Phase L2
        #   - Spannung der Phase L3
        #
        # In der Anwendung zu setzen:
        #   _ecu
        #       Relative Referenz auf die ECU.
        #   _counter_name
        #       Spezifischer Namensteil des Energiezählers,
        #       z. B. Stromzähler oder Energiezähler.
        #   _did
        #       Basis-DID des dreiphasigen Energiezählers.
        #
        # Beispiel:
        #   stromzaehler:
        #       _ecu: '...:_ecu1'
        #       _counter_name: Stromzähler
        #       _did: 3228
        #       struct: my.vitocal_250a.energy_meter_three_phase
        # =============================================================================
        leistung_l1:
            name: '{_counter_name} Leistung L1'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did}.PowerL1'
            open3e_read_cycle: 30

        leistung_l2:
            name: '{_counter_name} Leistung L2'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did}.PowerL2'
            open3e_read_cycle: 30

        leistung_l3:
            name: '{_counter_name} Leistung L3'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did}.PowerL3'
            open3e_read_cycle: 30

        spannung_l1:
            name: '{_counter_name} Spannung L1'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did}.VoltageL1'
            open3e_read_cycle: 60

        spannung_l2:
            name: '{_counter_name} Spannung L2'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did}.VoltageL2'
            open3e_read_cycle: 60

        spannung_l3:
            name: '{_counter_name} Spannung L3'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '..:{_did}.VoltageL3'
            open3e_read_cycle: 60

    heizkreis:
        # =============================================================================
        # Struct: heizkreis
        #
        # Zweck:
        #   Vollständige Definition eines Heizkreises einschließlich:
        #   - Heizkreisname
        #   - Vorlauf-Isttemperatur
        #   - Vorlauf-Solltemperatur
        #   - externer Vorlauf-Sollwert
        #   - Rücklauf-Isttemperatur
        #   - Raumtemperatur
        #   - Luftfeuchtigkeit
        #   - Betriebsmodus
        #   - Betriebsprogramm
        #   - Raumtemperatur-Sollwerte
        #   - Heizkreispumpe
        #   - Mischer
        #   - Heizkurve
        #   - Sommersparschwelle
        #
        # Beispiel:
        #   heizkreis1:
        #       _ecu: '..:_ecu1'
        #       _circuit: HK1
        #       _did_name: 627
        #       _did_flow_actual: 284
        #       _did_flow_target: 987
        #       _did_flow_target_external: 1627
        #       _did_return_actual: 285
        #       _did_room_actual: 334
        #       _did_humidity: 2479
        #       _did_external_mode: 537
        #       _did_operation_state: 1415
        #       _did_room_setpoints: 424
        #       _did_pump: 401
        #       _did_mixer: 475
        #       _did_heating_curve: 880
        #       _did_summer_saving: 1395
        #       struct: my.vitocal_250a.heizkreis
        # =============================================================================

        name:
            type: str
            open3e_ecu: '..:_ecu'
            open3e_did: '..:_did_name'
            open3e_read_cycle: 86400

        vorlauf_ist:
            name_: '{..:_circuit} Vorlauftemperatur Ist'
            type: num

            _name_: '{..:_circuit} Vorlauftemperatur Ist'
            _did_desc: MixerOneCircuitFlowTemperatureSensor
            _ecu: ..:_ecu
            _did: ..:_did_flow_actual
            _read_cycle: 60

            struct: .sensor_short

        vorlauf_soll:
            name_: '{..:_circuit} Vorlauftemperatur Soll'
            type: num
            open3e_write: true
            open3e_ecu: '..:_ecu'
            open3e_did: '..:_did_flow_target'
            open3e_read_cycle: 60

        vorlauf_min_max:
            name: '{..:_circuit} Vorlauftemperatur Grenzen'
            type: dict
            open3e_ecu: '..:_ecu'
            open3e_did: '..:_did_flow_minmax'
            open3e_read_cycle: 3600

        vorlauf_soll_extern:
            name_: '{..:_circuit} Vorlauf Sollwert extern'
            type: num
            open3e_write: true
            open3e_ecu: '..:_ecu'
            open3e_did_: '{..:_did_flow_target_external}'
            open3e_read_cycle: 60
            _did_desc: ExternalMixerOneCircuitFixedValueTargetTemperatureSetpoint

        ruecklauf_ist:
            name_: '{..:_circuit} Rücklauftemperatur Ist'
            type: num

            _name_: '{..:_circuit} Rücklauftemperatur Ist'
            _did_desc: MixerOneCircuitReturnTemperatureSensor
            _ecu: ..:_ecu
            _did: ..:_did_return_actual
            _read_cycle: 60

            struct: .sensor_short

        raumtemperatur_ist:
            name_: '{..:_circuit} Raumtemperatur Ist'
            type: num

            _name_: '{..:_circuit} Raumtemperatur Ist'
            _did_desc: MixerOneCircuitRoomTemperatureSensor
            _ecu: ..:_ecu
            _did: ..:_did_room_actual
            _read_cycle: 60

            struct: .sensor_short

        raumtemperatur_soll:
            _read_cycle: 300

            komfort:
                name_: '{...:_circuit} Komforttemperatur'
                type: num
                open3e_ecu: '...:_ecu'
                open3e_did_: '{...:_did_room_setpoints}.Comfort'
                open3e_read_cycle: ..:_read_cycle

            standard:
                name_: '{...:_circuit} Standardtemperatur'
                type: num
                open3e_ecu: '...:_ecu'
                open3e_did_: '{...:_did_room_setpoints}.Standard'
                open3e_read_cycle: ..:_read_cycle

            reduziert:
                name_: '{...:_circuit} reduzierte Temperatur'
                type: num
                open3e_ecu: '...:_ecu'
                open3e_did_: '{...:_did_room_setpoints}.Reduced'
                open3e_read_cycle: ..:_read_cycle

            raw:
                name_: '{...:_circuit} Raumtemperatur-Sollwerte'
                type: dict
                open3e_ecu: '...:_ecu'
                open3e_did: ...:_did_room_setpoints
                open3e_read_cycle: ..:_read_cycle
                _did_desc: MixerOneCircuitRoomTemperatureSetpoints
        
        # TODO: nicht decodiert 'ff00000004'
        luftfeuchtigkeit:
            name: '{_circuit} relative Luftfeuchtigkeit'
            type: str
            open3e_ecu: '..:_ecu'
            open3e_did: '..:_did_humidity'
            open3e_read_cycle: 300
            _did_desc: MixerOneCircuitRoomAirHumiditySensor

        betriebsmodus:
            soll:
                name_: '{...:_circuit} Betriebsmodus Soll'
                type: str

            ist:
                name_: '{...:_circuit} Betriebsmodus Ist'
                type: str

            raw:
                name: '{...:_circuit} Betriebsmodus'
                type: dict
                open3e_write: true
                open3e_ecu: '...:_ecu'
                open3e_did: ...:_did_external_mode
                open3e_read_cycle: 60
                _did_desc: ExternalMixerOneCircuitTargetOperationMode
                on_update: 
                  - ..soll = sh..lookup().get(sh..().get('Mode', 0), 'undefined')
                  - ..ist = sh..lookup().get(sh..().get('State', 0), 'undefined')

                lookup:
                    type: dict
                    initial_value: '{0: "Keine", 1: "Aus", 2: "Reduziert", 3: "Normal", 4: "Komfort", 5: "VL-Temp-Soll", 6: "Raumtemp-Soll"}'

        betriebsprogramm:
            soll:
                name: '{...:_circuit} Betriebsprogramm Soll'
                type: str

            ist:
                name: '{...:_circuit} Betriebsprogramm Ist'
                type: str

            raw:
                name_: '{...:_circuit} Betriebsprogramm'
                type: dict
                open3e_ecu: '...:_ecu'
                open3e_did_: '{...:_did_operation_state}'
                open3e_read_cycle: 60
                _did_desc: MixerOneCircuitOperationState

                on_update: 
                  - ..soll = sh..().get('Mode', {}).get('Text', '-')
                  - ..ist = sh..().get('State', {}).get('Text', '-')

        urlaub:
            urlaubsphase:
                name: '{...:_circuit} Urlaubsphase'
                description: HolidayPhase
                type: dict
                open3e_did: '...:_did_holiday'
                open3e_ecu: '...:_ecu'
                open3e_read_cycle: 3600

            urlaubsphase_zuhause:
                name: '{...:_circuit} Urlaub-Zuhause Phase'
                description: HolidayAtHomePhase
                type: dict
                open3e_did: '...:_did_holiday_at_home'
                open3e_ecu: '...:_ecu'
                open3e_read_cycle: 3600

        pumpe:
            _ecu: '..:_ecu'
            _did: '..:_did_pump'
            _circuit: '..:_circuit'
            _read_cycle: 30
            struct: .pumpe

        mischer:
            _ecu: '..:_ecu'
            _did: '..:_did_mixer'
            _circuit: '..:_circuit'
            _read_cycle: 30
            struct: .mischer

        heizkurve:
            _ecu: '..:_ecu'
            _did: '..:_did_heating_curve'
            _circuit: '..:_circuit'
            _read_cycle: 3600
            struct: .heizkurve

        sommersparschwelle:
            name: '{_circuit} Sommersparschwelle'
            type: num
            open3e_ecu: '..:_ecu'
            open3e_did_: '{..:_did_summer_saving}.Temperature'
            open3e_read_cycle: 3600

    sensor_full:
        # =============================================================================
        # Struct: sensor_full
        #
        # Zweck:
        #   Vollständige Definition eines Sensors einschließlich:
        #   - Istwert
        #   - Minimalwert
        #   - Maximalwert
        #   - Durchschnittswert
        #   - Sensorstatus
        #   - Rohwert des DIDs
        #
        # Beispiel:
        #   sensor_oeltemperatur:
        #       _did_desc: CompressorInletTemperatureSensor
        #       _ecu: '...:_ecu1'
        #       _did: 1772
        #       _read_cycle: 30
        #       struct: my.vitocal_250a.sensor_full

        minimum:
            name_: '{..:name} Minimum'
            type: num

        maximum:
            name_: '{..:name} Maximum'
            type: num

        average:
            name_: '{..:name} Durchschnitt'
            type: num

        sensorstatus:
            name_: '{..:name} Sensorstatus'
            type: str

        raw:
            name_: '{..:name} Raw'
            type: dict
            open3e_ecu: ..:_ecu
            open3e_did: ..:_did
            open3e_read_cycle: ..:_read_cycle
            _did_desc: ..:_did_desc
            on_update:
            - .. = value.get("Actual")
            - ..minimum = value.get("Minimum")
            - ..maximum = value.get("Maximum")
            - ..average = value.get("Average")
            - ..sensorstatus = value.get("SensorStatus", {}).get("Text", "unknown")

    sensor_short:
        # =============================================================================
        # Struct: sensor_short
        #
        # Zweck:
        #   Vollständige Definition eines Sensors einschließlich:
        #   - Istwert
        #   - Sensorstatus
        #   - Rohwert des DIDs
        #
        # Beispiel:
        #   sensor_oeltemperatur:
        #       _did_desc: CompressorInletTemperatureSensor
        #       _ecu: '...:_ecu1'
        #       _did: 1772
        #       _read_cycle: 30
        #       struct: my.vitocal_250a.sensor_short

        sensorstatus:
            name_: '{..:name} - Sensorstatus'
            type: str

        raw:
            name_: '{..:name} - Raw'
            type: dict
            open3e_ecu: ..:_ecu
            open3e_did: ..:_did
            open3e_read_cycle: ..:_read_cycle
            _did_desc: ..:_did_desc
            on_update:
            - .. = value.get("Actual")
            - ..sensorstatus = value.get("SensorStatus", {}).get("Text", "unknown")        


logic_parameters: NONE


plugin_functions:
    scan_ecus:
        type: list
        description:
            de: 'Scannt das Systeme und gibt die Liste der gefundenen ECUs zurück'
            en: 'scan system and returns list of found ecus'
        parameters:
            start_cob:
                type: int
                default: 0x680
                description:
                    de: ''
                    en: ''
            last_cob: 
                type: int
                default: 0x6EF
                description:
                    de: ''
                    en: ''

    scan_did_on_ecu:
        type: dict
        description:
            de: 'Scannt die ECU und gibt ein dict der gefundenen DIDs zurück'
            en: 'scan ECU and returns dict of found DIDs'
        parameters:
            ecu:
                type: int
                default: 0x680
                description:
                    de: 'ECU Adresse, die nach DIDs gescannt werden soll'
                    en: ''
            start_did:
                type: int
                default: 256
                description:
                    de: ''
                    en: ''
            last_did: 
                type: int
                default: 4000
